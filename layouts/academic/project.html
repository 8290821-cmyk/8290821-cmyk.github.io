{{ partial "academic/head.html" . }}
<header class="detail-header"><a href="{{ `/` | relURL }}">Yufan Huang</a></header>
<main id="main" class="paper-main project-detail">
  <a class="back-link" href="{{ `/` | relURL }}#projects">← Back to projects</a>
  <div class="paper-heading"><p class="status">Design project</p><h1>{{ .Title }}</h1><p class="meta">{{ delimit (.Params.tags | default slice) " · " }}</p></div>
  {{ if .Params.tiny }}<div class="tiny-art"><img src="{{ `figma/project-imgGroup662.png` | relURL }}" alt="Tiny Alchemists game artwork" width="639" height="293"></div>{{ end }}
  <div class="project-body">{{ .Content }}</div>
  {{ with .Params.links }}<div class="project-resources">{{ range . }}<a class="pill" href="{{ .url }}">{{ .name }} ↗</a>{{ end }}</div>{{ end }}
  <footer class="paper-footer"><a class="back-link" href="{{ `/` | relURL }}#projects">← Explore all projects</a></footer>
</main></body></html>
