<article class="publication-card" aria-labelledby="title-{{ .slug }}">
  <span class="status">{{ .status }}</span>
  <h3 id="title-{{ .slug }}"><a href="{{ (printf `research/%s/` .slug) | relURL }}">{{ .title }}</a></h3>
  <p class="meta">{{ .meta }}</p>
  <p>{{ .summary }}</p>
  <div class="publication-actions">
    <a class="pill" href="{{ (printf `research/%s/` .slug) | relURL }}">{{ if hasPrefix .status `PUBLISHED` }}View publication{{ else }}View research{{ end }} <span aria-hidden="true">→</span></a>
    {{ range .links }}<a class="pill" href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .name }} ↗</a>{{ end }}
    {{ with .pdf }}<a class="pill" href="{{ . | relURL }}">Read PDF ↗</a>{{ end }}
  </div>
</article>
